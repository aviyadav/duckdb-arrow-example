[project]
name = "converting-csv-files-to-optimized-parquet"
version = "0.1.0"
description = "Benchmark converting large CSV datasets to optimized Parquet with DuckDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.5.3",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "ruff>=0.16.7",
]
